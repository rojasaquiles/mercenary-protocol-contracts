[profile.default]
src = "src"
out = "out"
test = "test"
cache_path = "cache"
libs = ["lib"]

# ====================================================================
# CONFIGURACIÓN CRÍTICA REQUERIDA POR OPENZEPPELIN UPGRADES
# Habilita el acceso al sistema de archivos y las validaciones de storage.
# ====================================================================
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]

# ====================================================================
# REMAPEOS COMPLETOS
# ====================================================================
remappings = [
    # Ruta de los contratos actualizables de OpenZeppelin
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    
    # RUTA REQUERIDA: para que Foundry encuentre la librería 'Upgrades.sol'
    "openzeppelin-foundry-upgrades/=lib/openzeppelin-foundry-upgrades/src/",

    # Asegúrate de que forge-std también sea relativo
    "forge-std/=lib/forge-std/src/",
]

optimizer = true
optimizer_runs = 200
viaIR = true